<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAWAF SYSTEM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:black;
color:white;
overflow:hidden;
}

/* LOGIN PAGE */

#loginPage{
position:absolute;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:black;
z-index:10;
}

.bg{
position:absolute;
width:100%;
height:100%;

background:
radial-gradient(circle at top left,#ff9900,transparent 30%),
radial-gradient(circle at bottom right,#ff5500,transparent 30%),
#050505;

animation:bgMove 8s infinite alternate;
}

@keyframes bgMove{

from{
filter:hue-rotate(0deg);
}

to{
filter:hue-rotate(25deg);
}

}

.login-box{

position:relative;

width:360px;

padding:35px;

border-radius:25px;

backdrop-filter:blur(20px);

background:rgba(20,20,20,0.75);

border:1px solid rgba(255,255,255,0.1);

box-shadow:
0 0 35px rgba(255,140,0,0.5);

}

h1{
font-size:40px;
margin-bottom:10px;
}

p{
color:#aaa;
margin-bottom:20px;
}

input{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:14px;

background:#111;

color:white;

font-size:16px;

outline:none;

border:1px solid #222;

}

input:focus{

border:1px solid orange;

box-shadow:0 0 12px orange;

}

button{

width:100%;

padding:15px;

margin-top:18px;

border:none;

border-radius:14px;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:0.3s;

}

.signup{
background:linear-gradient(45deg,#ff9900,#ff5500);
color:white;
}

.login-btn{
background:#111;
border:1px solid orange;
color:white;
}

/* SOCIAL */

.social-login{
display:flex;
gap:10px;
margin-top:18px;
}

.google-btn,
.apple-btn{

flex:1;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

}

.google-btn{
background:white;
color:black;
}

.apple-btn{
background:black;
color:white;
border:1px solid white;
}

.social-login img{
width:20px;
height:20px;
}

.apple-icon{
filter:invert(1);
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 20px orange;
}

#msg{
margin-top:15px;
text-align:center;
color:white;
}

/* BARCODE PAGE */

#mainSite{
display:none;
width:100%;
height:100vh;
background:#050505;
padding:20px;
overflow:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout{
background:red;
padding:12px 20px;
border:none;
border-radius:12px;
color:white;
cursor:pointer;
}

video{
width:100%;
max-width:500px;
border-radius:20px;
border:2px solid orange;
margin-top:20px;
}

.result{
margin-top:20px;
background:#111;
padding:20px;
border-radius:20px;
}

.result img{
width:150px;
border-radius:15px;
margin-top:15px;
}

.scan-btn{
background:orange;
color:white;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="bg"></div>

<div class="login-box">

<h1>NAWAF SYSTEM</h1>

<p>Secure Access Panel</p>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button class="signup" onclick="signup()">
Sign Up
</button>

<button class="login-btn" onclick="login()">
Sign In
</button>

<div class="social-login">

<button onclick="googleLogin()" class="google-btn">

<img
src="https://cdn-icons-png.flaticon.com/512/300/300221.png">

Google

</button>

<button onclick="appleLogin()" class="apple-btn">

<img
src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg"
class="apple-icon">

Apple

</button>

</div>

<p id="msg"></p>

</div>

</div>

<!-- MAIN SITE -->

<div id="mainSite">

<div class="top">

<h1>KETA SCAN 🔥</h1>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

<button class="scan-btn" onclick="startScanner()">
Start Scanner
</button>

<br>

<video id="video" autoplay playsinline></video>

<div class="result">

<h2>Barcode Result</h2>

<p id="barcodeText">Waiting...</p>

<img id="productImage" src="" style="display:none;">

<p id="productName"></p>

<p id="productPrice"></p>

<p id="productCountry"></p>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
OAuthProvider,
signOut

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

BrowserMultiFormatReader

} from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDDRhhu8zgYePceanrXE8IeEo_bn0aPGB0",

authDomain: "keta-scan.firebaseapp.com",

databaseURL: "https://keta-scan-default-rtdb.firebaseio.com",

projectId: "keta-scan",

storageBucket: "keta-scan.firebasestorage.app",

messagingSenderId: "603380357430",

appId: "1:603380357430:web:08603b5c00afabec54bb97",

measurementId: "G-8VCSY4EFTQ"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN */

window.signup = function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

createUserWithEmailAndPassword(auth,email,password)

.then(() => {

showSite();

})

.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

});

};

window.login = function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(() => {

showSite();

})

.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

});

};

window.googleLogin = function(){

const provider =
new GoogleAuthProvider();

signInWithPopup(auth,provider)

.then(() => {

showSite();

})

.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

});

};

window.appleLogin = function(){

const provider =
new OAuthProvider('apple.com');

signInWithPopup(auth,provider)

.then(() => {

showSite();

})

.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

});

};

window.logout = function(){

signOut(auth).then(()=>{

document.getElementById("loginPage").style.display = "flex";

document.getElementById("mainSite").style.display = "none";

});

};

function showSite(){

document.getElementById("loginPage").style.display = "none";

document.getElementById("mainSite").style.display = "block";

}

/* BARCODE */

const codeReader =
new BrowserMultiFormatReader();

window.startScanner = async function(){

const video =
document.getElementById("video");

const devices =
await BrowserMultiFormatReader.listVideoInputDevices();

const selectedDeviceId =
devices[0].deviceId;

codeReader.decodeFromVideoDevice(
selectedDeviceId,
video,

(result, err) => {

if(result){

const barcode =
result.text;

document.getElementById("barcodeText").innerHTML =
barcode;

/* صوت */

const audio =
new Audio("https://www.soundjay.com/buttons/sounds/beep-07.mp3");

audio.play();

/* بيانات وهمية */

document.getElementById("productImage").style.display = "block";

document.getElementById("productImage").src =
"https://picsum.photos/200";

document.getElementById("productName").innerHTML =
"Product: KETA ITEM";

document.getElementById("productPrice").innerHTML =
"Price: 99 SAR";

document.getElementById("productCountry").innerHTML =
"Made In: Saudi Arabia";

}

});

};

</script>

</body>
</html>
