<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KETA SCAN</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,
ref,
set,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "ضع_apiKey",
authDomain: "ضع_authDomain",
databaseURL: "ضع_databaseURL",
projectId: "ضع_projectId",
storageBucket: "ضع_storageBucket",
messagingSenderId: "ضع_senderId",
appId: "ضع_appId"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const barcodeRef = ref(db, "liveBarcode");

window.startScanner = function () {

const scanner = new Html5Qrcode("reader");

scanner.start(
{ facingMode: "environment" },
{
fps: 10,
qrbox: 250
},
(decodedText) => {

set(barcodeRef, {
code: decodedText,
time: new Date().toLocaleTimeString()
});

document.getElementById("status").innerText = "تم المسح";

},
(error) => {}
);

};

onValue(barcodeRef, (snapshot) => {

const data = snapshot.val();

if(data){

document.getElementById("barcode").innerText = data.code;
document.getElementById("time").innerText =
"آخر عملية: " + data.time;

const audio = new Audio(
"https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

audio.play();

}

});
</script>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:1200px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#0f172a;
border-radius:30px;
padding:20px;
box-shadow:0 0 30px rgba(59,130,246,.2);
}

.logo{
font-size:40px;
font-weight:bold;
margin-bottom:20px;
text-align:center;
color:#38bdf8;
}

#reader{
overflow:hidden;
border-radius:20px;
}

.live{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100%;
}

.barcode{
font-size:40px;
margin-top:20px;
word-break:break-all;
text-align:center;
color:#22d3ee;
}

.time{
margin-top:15px;
color:#94a3b8;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
font-size:18px;
background:#0ea5e9;
color:white;
cursor:pointer;
margin-top:20px;
}

.status{
margin-top:15px;
background:#22c55e;
padding:10px 18px;
border-radius:50px;
display:inline-block;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">KETA SCAN</div>

<div id="reader"></div>

<button onclick="startScanner()">
تشغيل الكاميرا
</button>

<div class="status" id="status">
جاهز للمسح
</div>

</div>

<div class="card live">

<h1>الباركود المباشر</h1>

<div class="barcode" id="barcode">
بانتظار المسح...
</div>

<div class="time" id="time"></div>

</div>

</div>

</body>
</html>
